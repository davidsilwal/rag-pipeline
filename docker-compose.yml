# version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1800m
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 200m
    command: redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    mem_limit: 800m
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    build:
      context: ./apps/control_api
      dockerfile: Dockerfile
    image: rag-pipeline-control-api:latest
    restart: unless-stopped
    mem_limit: 400m
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      API_TOKEN: ${API_TOKEN}
      WIKI_REPO_PATH: /var/data/wiki
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    image: rag-pipeline-worker:latest
    restart: on-failure
    mem_limit: 5120m
    environment:
      GPU_WORKER_CUDA: "0"
      CUDA_VISIBLE_DEVICES: ""
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      EMBED_ALLOW_CPU: ${EMBED_ALLOW_CPU:-1}
      # Worker gpu_worker modules use asyncpg directly (NOT SQLAlchemy), so a
      # plain postgresql:// URL is required (asyncpg rejects +asyncpg scheme).
      DATABASE_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      MAX_CONCURRENT_TASKS: "8"
      API_TOKEN: ${API_TOKEN}
      CONTROL_API_URL: http://control-api:8000/api/v1
      DOCKER_WORKER: "1"
      HF_TOKEN: ${HF_TOKEN}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      ONEDRIVE_DRIVE_ID: ${ONEDRIVE_DRIVE_ID}
      ONEDRIVE_ROOT_FOLDER: /Enterprise_Knowledge_Base
      LOCAL_SOURCE_DIR: /root/repos
      LOCAL_LLM_MODEL: free
    volumes:
      - .:/workspace
      - ./policies:/app/policies
      - /root/repos:/root/repos:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-api:
        condition: service_started

volumes:
  pg_data:
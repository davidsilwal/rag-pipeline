# rag-pipeline compose — with worker wired to litellm-proxy_default network so
# the markdown compiler can call the local LLM via Docker DNS.
# (Compose v2 schema; v1 `version:` key is ignored.)

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 1800m
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 200m
    command: redis-server --maxmemory 150mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    mem_limit: 800m
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    build:
      context: ./apps/control_api
      dockerfile: Dockerfile
    image: rag-pipeline-control-api:latest
    restart: unless-stopped
    mem_limit: 400m
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      API_TOKEN: ${API_TOKEN}
      WIKI_REPO_PATH: /var/data/wiki
      # RAG /ask endpoint — reach the same LiteLLM gateway the worker uses.
      LOCAL_LLM_API_BASE: ${LOCAL_LLM_API_BASE:-http://litellm-proxy:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-free}
      LOCAL_LLM_FALLBACK_ALIASES: ${LOCAL_LLM_FALLBACK_ALIASES:-free,free-auto,free-a,free-b,free-c,free-d,free-e,free-f,free-g,free-h,free-i,free-j,free-k}
      LOCAL_LLM_MAX_TOKENS: "8192"
      # Filesystem browse + server-path registration is confined to the ingest
      # root. Bind-mount it so the operator can add files present on the host.
      INGEST_ROOT: ${INGEST_ROOT:-/var/data/ingest}
    volumes:
      - ${INGEST_ROOT:-/var/data/ingest}:${INGEST_ROOT:-/var/data/ingest}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - litellm-proxy_default

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the JS bundles at build time,
      # so the API URL must be supplied here — and it must be reachable from
      # the user's browser (Tailscale IP), not just from Docker DNS.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: rag-pipeline-dashboard:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # The dashboard authenticates against the control API with the same
      # token the API itself validates (DASHBOARD_API_TOKEN == API_TOKEN).
      DASHBOARD_API_TOKEN: ${API_TOKEN}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      control-api:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    image: rag-pipeline-worker:latest
    restart: on-failure
    mem_limit: 5120m
    environment:
      GPU_WORKER_CUDA: "0"
      CUDA_VISIBLE_DEVICES: ""
      EMBEDDING_MODEL_NAME: BAAI/bge-m3
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      EMBED_ALLOW_CPU: ${EMBED_ALLOW_CPU:-1}
      # Worker gpu_worker modules use asyncpg directly (NOT SQLAlchemy), so a
      # plain postgresql:// URL is required (asyncpg rejects +asyncpg scheme).
      DATABASE_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/knowledge_base
      REDIS_URL: redis://redis:6379/0
      MAX_CONCURRENT_TASKS: "4"
      EMBED_BATCH_SIZE: "128"
      # Embed only a representative slice of the corpus (CPU-only box has no
      # GPU, so full 317k would take weeks). 0 = unlimited. Cluster/dedup run
      # on whatever gets embedded.
      EMBED_MAX_UNITS: ${EMBED_MAX_UNITS:-5000}
      # Temporarily disable graphrag to let embed drain the 14K queue first.
      STAGES_ENABLED: clone,discover,extract,chunk,embed,dedup,cluster,consensus,compile
      API_TOKEN: ${API_TOKEN}
      CONTROL_API_URL: http://control-api:8000/api/v1
      DOCKER_WORKER: "1"
      HF_TOKEN: ${HF_TOKEN}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      ONEDRIVE_DRIVE_ID: ${ONEDRIVE_DRIVE_ID}
      ONEDRIVE_ROOT_FOLDER: /Enterprise_Knowledge_Base
      # Clone/discover land in the shared ingest root — the same rw host dir
      # the control-api server picker browses (INGEST_ROOT). Must be writable:
      # /root/.okf is bind-mounted :ro, so cloning there failed with EROFS.
      INGEST_ROOT: ${INGEST_ROOT:-/var/data/ingest}
      LOCAL_SOURCE_DIR: ${INGEST_ROOT:-/var/data/ingest}
      LOCAL_LLM_MODEL: free
      # The litellm-proxy runs in a separate docker-compose project. The
      # worker's default network cannot reach `litellm-proxy` by DNS, so we
      # connect the worker to the external `litellm-proxy_default` network
      # (declared under `networks:` below) and address it by the container
      # name. If the proxy is moved to a different host, override this
      # with `LOCAL_LLM_API_BASE=http://<host>:<port>/v1`.
      LOCAL_LLM_API_BASE: http://litellm-proxy:4000/v1
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      LOCAL_LLM_MAX_TOKENS: "8192"
      GRAPHRAG_MODELS: openrouter/nemotron-nano-omni,openrouter/nemotron-super,free
      LOCAL_LLM_MAX_ATTEMPTS: "8"
      LOCAL_LLM_FALLBACK_ALIASES: "free,free-auto,free-a,free-b,free-c,free-d,free-e,free-f,free-g,free-h,free-i,free-j,free-k"
    volumes:
      - .:/workspace
      - ./policies:/app/policies
      - /root/repos:/root/repos:ro
      - /root/.okf:/root/.okf:ro
      - ${INGEST_ROOT:-/var/data/ingest}:${INGEST_ROOT:-/var/data/ingest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control-api:
        condition: service_started
    networks:
      - default
      - litellm-proxy_default

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    image: wiki-mcp-server:latest
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/knowledge_base
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  pg_data:

networks:
  default:
    name: rag-pipeline_default
  litellm-proxy_default:
    external: true
    name: litellm-proxy_default
